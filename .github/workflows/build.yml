name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Windows Server runners ship with the audio service stopped; the self-test lists audio devices.
      - name: Start Windows Audio
        shell: pwsh
        run: |
          Set-Service Audiosrv -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service Audiosrv -ErrorAction SilentlyContinue

      # Tests, publish, then the self-test on the finished exe. Device tests skip themselves without VB-CABLE.
      - name: Build release
        shell: pwsh
        run: ./build.ps1

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $exe = "dist/RadioPassthrough-Setup-$($env:TAG.TrimStart('v')).exe"
          if (-not (Test-Path $exe)) { throw "Tag $env:TAG doesn't match <Version> in RadioPassthrough.csproj" }

      # Every screen rendered off-screen, for keeping docs/screenshots current. Never blocks a build.
      - name: Render screenshots
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList '--snapshot screenshots --theme dark' -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Snapshot timed out' }
          Get-ChildItem screenshots

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: warn

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RadioPassthrough-Setup
          path: dist/*
          if-no-files-found: error

  # Only for v* tags: GitHub signs a build record for the exe (proof it was built here, from this
  # tag's source) and publishes the release. Nothing built on a personal PC is ever released.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the build record
      attestations: write # store the build record
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: RadioPassthrough-Setup
          path: dist

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.exe

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          exe="RadioPassthrough-Setup-$version.exe"
          changes=$(awk -v h="## $version" '$0 == h { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md)
          if [ -z "$(printf '%s' "$changes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no '## $version' section with notes"
            exit 1
          fi
          repo="https://github.com/$GITHUB_REPOSITORY"
          cat > notes.md <<EOF
          **Install:** download \`$exe\`, run it and click **Install** (no admin rights needed). If Windows shows *Windows protected your PC*, click **More info → Run anyway**; the file isn't code-signed yet. Then follow the Setup checklist: **Get VB-CABLE** (VB-Audio's official page), then **TeamSpeak → Set up**.

          **Already installed?** Run the new file and click **Update**. Your settings, radio keys and TeamSpeak setup are kept.

          **Radio Passthrough never connects to the internet.** It has no networking code; a test and the release self-test enforce that.

          **Built by GitHub from this source.** This file was built and self-tested by [this workflow run]($repo/actions/runs/$GITHUB_RUN_ID) from the \`$TAG\` tag, and GitHub signed a [build record]($repo/attestations) for it. [How to check your download]($repo/blob/main/SECURITY.md#verifying-a-download). Code signing: see the [code signing policy]($repo#code-signing-policy) (applied for with SignPath Foundation).

          **What's new**
          $changes
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Radio Passthrough $TAG" --notes-file notes.md
