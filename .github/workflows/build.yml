name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Device tests skip themselves on runners without VB-CABLE.
      - name: Test
        run: dotnet test --nologo

      - name: Build release
        shell: pwsh
        run: ./build.ps1 -SkipTests -SkipSelfTest

      - uses: actions/upload-artifact@v4
        with:
          name: RadioPassthrough-Setup
          path: dist/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Skipped when the release was already published by hand from a self-tested local build.
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release exists; leaving it as is."; exit 0 }
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist/*).FullName --title "Radio Passthrough ${{ github.ref_name }}" --notes "Download RadioPassthrough-Setup, run it, press Install. See CHANGELOG.md for what's new."
